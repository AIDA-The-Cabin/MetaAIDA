<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; width: 270px; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0B0C0E; color: #F4F2ED; padding: 16px 18px; }
      .t { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; margin: 0; background: linear-gradient(135deg,#9C7A2E,#E7C977,#F8ECC6,#E7C977,#9C7A2E); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .s { font-size: 10px; color: #7E828B; letter-spacing: .22em; text-transform: uppercase; margin: 2px 0 16px; }
      .row { display: flex; align-items: center; justify-content: space-between; }
      .lab { font-size: 14px; }
      .sw { position: relative; width: 48px; height: 27px; border-radius: 14px; background: #2A2E35; cursor: pointer; transition: background .2s; flex: none; }
      .sw.on { background: linear-gradient(180deg,#E7C977,#C9A24B); }
      .kn { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: left .2s; }
      .sw.on .kn { left: 24px; }
      .cap { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #7E828B; margin: 0 0 10px; }
      .opt { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid #2A2E35; border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: #131519; transition: border-color .15s, background .15s; }
      .opt.sel { border-color: #C9A24B; background: #1B1E24; }
      .opt .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #5F5E5A; flex: none; position: relative; }
      .opt.sel .dot { border-color: #C9A24B; }
      .opt.sel .dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #E7C977; }
      .opt .nm { font-size: 14px; }
      .opt .meta { margin-left: auto; font-size: 11px; color: #7E828B; }
      .credits { display: flex; align-items: center; justify-content: space-between; padding: 9px 13px; margin-bottom: 14px; border: 1px solid #C9A24B; border-radius: 10px; background: #1B1E24; }
      .credits-l { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #B9BBC0; }
      .credits-v { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; line-height: 1; background: linear-gradient(135deg,#9C7A2E,#E7C977,#F8ECC6,#E7C977,#9C7A2E); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .hint { font-size: 11px; color: #7E828B; margin-top: 14px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="credits"><span class="credits-l">Credits</span><strong class="credits-v" id="credits">—</strong></div>
    <p class="t">The Cabin</p>
    <p class="s">virtual try-on</p>

    <div class="row">
      <span class="lab" id="lab">On</span>
      <div class="sw on" id="sw"><div class="kn"></div></div>
    </div>

    <p class="cap" style="margin-top: 16px;">Scope</p>
    <div class="opt" data-scope="image"><span class="dot"></span><span class="nm">Individual</span><span class="meta">this image</span></div>
    <div class="opt" data-scope="page"><span class="dot"></span><span class="nm">Perpetual</span><span class="meta">all photos</span></div>

    <p class="hint">Turn off to check whether a page problem is caused by the extension. Reload the page after changing settings.</p>
    <script src="popup.js"></script>
  </body>
</html>
