<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rochie midi neagră · Busem — Fashion Days (mock)</title>
    <meta property="og:title" content="Rochie midi neagră · Busem" />
    <meta
      property="og:image"
      content="https://fdcdn.akamaized.net/m/390x585/products/114045/114044388/images/res_fefab61320f6cbd35b26b7642c8fa710.jpg?s=fBiHc48XHi-M"
    />
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f1ec; color: #1a1a1a; }
      header { padding: 16px 28px; border-bottom: 1px solid #e3ddd2; font-weight: 700; letter-spacing: .2em; font-size: 14px; }
      main { max-width: 1000px; margin: 0 auto; padding: 38px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 44px; }
      img.pdp { width: 100%; border-radius: 14px; background: #e6e1d8; aspect-ratio: 390/585; object-fit: cover; }
      h1 { font-size: 28px; margin: 0 0 12px; font-weight: 600; }
      .brand { text-transform: uppercase; letter-spacing: .22em; color: #b09a76; font-size: 12px; margin: 0 0 8px; }
      .price { font-size: 22px; margin: 0 0 26px; }
      #actions { max-width: 360px; }
      #add { width: 100%; height: 50px; border: none; border-radius: 11px; background: #1a1a1a; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
      @media (max-width: 640px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>FASHION&nbsp;DAYS <span style="color:#aaa;font-weight:400;letter-spacing:0">· mock PDP (no widget — the extension injects it)</span></header>
    <main>
      <div>
        <img class="pdp" referrerpolicy="no-referrer"
          src="https://fdcdn.akamaized.net/m/390x585/products/114045/114044388/images/res_fefab61320f6cbd35b26b7642c8fa710.jpg?s=fBiHc48XHi-M"
          alt="Rochie midi neagră Busem" />
      </div>
      <div>
        <p class="brand">Busem</p>
        <h1>Rochie midi neagră</h1>
        <p class="price">129,99 lei</p>
        <div id="actions"><button id="add">Adaugă în coș</button></div>
      </div>
    </main>
  </body>
</html>
